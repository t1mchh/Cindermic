name: Release desktop apps
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  desktop:
    name: Build · ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac-arm64
            runner: macos-latest
          - platform: mac-x64
            runner: macos-15-intel
          - platform: windows-x64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - if: runner.os == 'macOS'
        run: npm run dist:mac
      - if: runner.os == 'Windows'
        run: npm run dist:win
      - if: runner.os == 'Windows'
        run: npm run dist:win:zip
      - if: matrix.platform == 'mac-arm64'
        run: npx electron tests/audio.e2e.cjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            release/Cindermic-*.zip
            release/Cindermic-*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  publish:
    name: Publish verified downloads
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
